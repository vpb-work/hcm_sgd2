function recordsFromApi(data, expectedTab){
  if(Array.isArray(data&&data.records)) return data.records;
  const rows=Array.isArray(data&&data.rows)?data.rows:Array.isArray(data&&data.data)?data.data:[];
  return rows.map(row=>{
    const id=Array.isArray(row)?row[0]:row&&row.id;
    const tab=String(Array.isArray(row)?row[1]:(row&&row.tab)||'').trim().toUpperCase();
    const payload=Array.isArray(row)?row[2]:row&&row.payload;
    if(expectedTab&&expectedTab!=='ALL'&&tab!==expectedTab) return null;
    try{const record=typeof payload==='string'?JSON.parse(payload):payload;if(!record||typeof record!=='object')return null;if(id)record.id=String(id);record.sourceTab=tab;return record}catch(_){return null}
  }).filter(Boolean);
}
function jsonpApi(url){
  return new Promise((resolve,reject)=>{
    const callback='__sgd2Jsonp_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timer=setTimeout(()=>finish(new Error('JSONP timeout')),15000);
    function finish(error,data){clearTimeout(timer);try{delete window[callback]}catch(_){window[callback]=undefined}script.remove();error?reject(error):resolve(data)}
    window[callback]=data=>finish(null,data);
    script.onerror=()=>finish(new Error('Không kết nối được Google Apps Script'));
    script.src=url+(url.includes('?')?'&':'?')+'callback='+encodeURIComponent(callback);
    document.head.appendChild(script);
  });
}
function installApiFetchFallback(apiUrl){
  const nativeFetch=window.fetch.bind(window);
  window.fetch=async function(input,init){
    try{return await nativeFetch(input,init)}catch(error){
      const url=String(input);const method=String((init&&init.method)||'GET').toUpperCase();
      if(method!=='GET'||!url.startsWith(apiUrl))throw error;
      const data=await jsonpApi(url);
      return {ok:true,status:200,json:async()=>data};
    }
  };
}

document.querySelectorAll('.main-tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.main-tab').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.tab-panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+btn.dataset.tab))});
$('overallToggle').onclick=()=>{const open=$('overallDetails').classList.toggle('open');$('overallToggle').textContent=open?'Thu gọn chi tiết ▴':'Xem chi tiết nhân sự ▾'};$('overallDate').onchange=renderOverall;
function showGlobalToast(){const toast=$('globalToast');if(!toast)return;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');clearTimeout(window.__globalToastTimer);window.__globalToastTimer=setTimeout(()=>toast.classList.remove('show'),3000)}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='report-saved'){showGlobalToast();loadOverall()}});
async function loadOverall(){try{const res=await fetch(DAILY_API_URL+'?tab=ALL&t='+Date.now(),{cache:'no-store'});const data=await res.json();if(!res.ok||data.status!=='ok')throw new Error(data.message||('HTTP '+res.status));overallRecords=recordsFromApi(data,'ALL');renderOverall()}catch(e){$('overallDetails').innerHTML='<div class="empty-note">Không tải được dữ liệu Overall: '+esc(e.message)+'</div>'}}
function renderOverall(){const date=$('overallDate').value,rs=overallRecords.filter(r=>r.date===date),has=(name,type)=>rs.some(r=>r.employee===name&&r.type===type),plan=ALL_EMPLOYEES.filter(e=>has(e.name,'plan')).length,eod=ALL_EMPLOYEES.filter(e=>has(e.name,'eod')).length,total=ALL_EMPLOYEES.length;$('overallPlan').textContent=plan+'/'+total;$('overallEod').textContent=eod+'/'+total;const groups=[['RMP',RMP_EMPLOYEES],['LS',LS_EMPLOYEES],['RMD',RMD_EMPLOYEES],['FX',FX_EMPLOYEES],['CSR',CSR_EMPLOYEES]];$('overallDetails').innerHTML=groups.map(([label,people])=>'<div class="group"><div class="group-title"><span>'+label+'</span><span>'+people.length+' nhân sự</span></div><div class="people">'+people.map(e=>'<div class="person"><span class="person-name">'+esc(e.name)+' · '+e.team+'</span><span class="badge '+(has(e.name,'plan')?'done':'missing')+'">Đầu ngày: '+(has(e.name,'plan')?'Đã điền':'Chưa điền')+'</span><span class="badge '+(has(e.name,'eod')?'done':'missing')+'">Cuối ngày: '+(has(e.name,'eod')?'Đã điền':'Chưa điền')+'</span></div>').join('')+'</div></div>').join('')}
loadOverall();
</script></body></html>
